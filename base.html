{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Fake Job Detector</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="icon" type="images/x-icon" href="{% static 'images/favicon.ico' %}">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f5f9ff;
        }

        /* Navbar */
        .navbar-custom {
            background: linear-gradient(90deg, #0d6efd, #0b5ed7);
            padding: 12px 0;
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 20px;
            color: white !important;
        }

        .nav-link {
            color: white !important;
            font-weight: 500;
            margin-right: 15px;
        }

        .nav-link:hover {
            color: #cfe2ff !important;
        }

        .btn-login {
            background: white;
            color: #0d6efd;
            font-weight: 600;
            border-radius: 30px;
            padding: 6px 20px;
        }

        /* Footer */
        footer {
            background-color: #0d6efd;
            color: white;
            padding: 20px 0;
            margin-top: 80px;
        }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
    <div class="container">
        <a class="navbar-brand" href="/">🛡 AI Fake Job Detector</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
            <ul class="navbar-nav align-items-center">
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/about_us/">About</a></li>
               <li class="nav-item"><a class="nav-link" href="{% url 'submit_job' %}">Submit Job<a></li>
                <li class="nav-item"><a class="nav-link" href="/history/">History</a></li>
                <li class="nav-item">
                    <a class="btn btn-login ms-3" href="/login/">Login</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

{% block content %}{% endblock %}

<!-- FOOTER -->
<footer class="text-center">
    <div class="container">
        <p class="mb-0">© 2026 AI Fake Job Detector | Built with Django & AI</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
