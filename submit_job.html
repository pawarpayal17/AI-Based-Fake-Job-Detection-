{% extends 'base.html' %}
{% block content %}

<section class="py-5">
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                
                <div class="card shadow-lg p-4 border-0 rounded-4">
                    <h3 class="text-primary mb-4 fw-semibold">
                        Submit Job Posting
                    </h3>

                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}

                        <button type="submit" class="btn btn-primary w-100 mt-3 rounded-3">
                            Analyze Job
                        </button>
                    </form>
                </div>

            </div>
        </div>
    </div>
</section>

{% endblock %}
